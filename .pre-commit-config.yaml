repos:
  - repo: local
    hooks:
      - id: update-pak-scripts
        name: Update pak installer scripts
        entry: ./scripts/update-pak-scripts.sh
        language: script
        files: ^rpixi\.toml$
        pass_filenames: false

      - id: gate-static
        name: Static release gate
        entry: python3 scripts/gate/static.py
        language: system
        pass_filenames: false
        stages: [manual]
