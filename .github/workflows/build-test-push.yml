---
name: Build, Test, and Push Single Architecture Image

on:
  workflow_call:
    inputs:
      title:
        description: The title of the image
        type: string
        required: true
      description:
        description: The description of the image
        type: string
        required: true
      image:
        description: The name image to build (also corresponds to a Pixi environment)
        type: string
        required: true
      platform:
        description: The platform to build for (linux/amd64 or linux/arm64)
        type: string
        required: true
      target:
        description: The target layer to build
        type: string
        required: false
      build-args:
        description: Build arguments to pass to the image
        type: string
        required: false
      extra-cache-from:
        description: Additional Docker images that might be able to contribute cached layers (beyond the automatic cache sources)
        type: string
        required: false
      free-disk-space:
        description: Whether to free disk space before building
        type: boolean
        required: false
        default: false
      skip-tests:
        description: Whether to skip tests
        type: boolean
        required: false
        default: false
      lock-artifact:
        description: Name of a workflow artifact containing an updated pixi.lock file to use instead of the checked-in version
        type: string
        required: false

    outputs:
      image:
        description: The image name
        value: ${{ jobs.build.outputs.image }}
      platform:
        description: The platform built
        value: ${{ jobs.build.outputs.platform }}
      digest:
        description: The image digest
        value: ${{ jobs.build.outputs.digest }}
      tag:
        description: The image tag (with platform suffix)
        value: ${{ jobs.build.outputs.tag }}
      cache-tag:
        description: The complete cache tag reference (e.g., ghcr.io/owner/image:cache-amd64)
        value: ${{ jobs.build.outputs.cache-tag }}

jobs:
  build:
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    outputs:
      image: ${{ inputs.image }}
      platform: ${{ inputs.platform }}
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.build.outputs.metadata }}
      cache-tag: ${{ steps.context.outputs.cache-tag }}

    steps:
      - name: Setup build context
        id: context
        shell: bash
        run: |
          # Validate platform
          if [[ "${{ inputs.platform }}" != "linux/amd64" && "${{ inputs.platform }}" != "linux/arm64" ]]; then
            echo "::error title=Unsupported Platform::Platform '${{ inputs.platform }}' is not supported. Only linux/amd64 and linux/arm64 are supported."
            exit 1
          fi
          echo "::notice::Platform: ${{ inputs.platform }}"

          # Determine platform tag and construct cache tag
          if [[ "${{ inputs.platform }}" == "linux/amd64" ]]; then
            PLATFORM_TAG="amd64"
          else
            PLATFORM_TAG="arm64"
          fi
          CACHE_TAG="ghcr.io/${{ github.repository_owner }}/next/${{ inputs.image }}:cache-$PLATFORM_TAG"
          echo "cache-tag=$CACHE_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Cache tag: $CACHE_TAG"

          echo "secret-files=" >> "$GITHUB_OUTPUT"

          # Construct cache-from list
          {
            echo 'cache-from<<EOF'
            echo "type=registry,ref=ghcr.io/${{ github.repository_owner }}/next/${{ inputs.image }}:weekly"
            echo "type=registry,ref=$CACHE_TAG"
            if [[ -n "${{ inputs.extra-cache-from }}" ]]; then
              echo "${{ inputs.extra-cache-from }}"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Cache sources configured"

      - name: Free Disk Space (Ubuntu)
        if: inputs.free-disk-space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          tool-cache: true

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download updated lock file
        if: inputs.lock-artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.lock-artifact }}
          path: .

      - name: Setup Pixi
        if: inputs.target != 'base'
        uses: prefix-dev/setup-pixi@28eb668aafebd9dede9d97c4ba1cd9989a4d0004 # v0.9.2
        with:
          run-install: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platform }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          secret-files: ${{ steps.context.outputs.secret-files }}
          cache-to: |
            type=registry,ref=${{ steps.context.outputs.cache-tag }},mode=max
          cache-from: ${{ steps.context.outputs.cache-from }}
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/next/${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

      # Builds `final` plus bats and the suite. Every layer below the test
      # stage is already in the local build cache from the push above, so this
      # adds the test layers and nothing else, and what runs is byte-identical
      # to what was pushed.
      - name: Build test image
        if: inputs.skip-tests != true
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: test
          platforms: ${{ inputs.platform }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: ${{ steps.context.outputs.cache-from }}
          load: true
          push: false
          provenance: false
          tags: ${{ inputs.image }}:test

      - name: Test
        if: inputs.skip-tests != true
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          TEST_IMAGE: ${{ inputs.image }}:test
        run: docker run --rm --platform="$PLATFORM" "$TEST_IMAGE"

      # A record of what this image actually contains, not a prediction made
      # before it existed. Nothing gates on it; the two architectures may
      # legitimately resolve different versions of an unconstrained package.
      - name: Record installed R packages
        if: inputs.target != 'base'
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image }}
          PLATFORM: ${{ inputs.platform }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          docker run --rm --platform="$PLATFORM" \
            "ghcr.io/${REPO_OWNER}/next/${IMAGE_NAME}@${DIGEST}" \
            Rscript -e 'ip <- installed.packages()[, c("Package", "Version")]; cat(sprintf("%s@%s", ip[, 1], ip[, 2]), sep = "\n")' \
            | LC_ALL=C sort > "r-${IMAGE_NAME}.txt"
          wc -l < "r-${IMAGE_NAME}.txt" | xargs -I{} echo "r-${IMAGE_NAME}.txt: {} packages" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R package record
        if: inputs.target != 'base'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r-packages-${{ inputs.image }}-${{ inputs.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: r-${{ inputs.image }}.txt
