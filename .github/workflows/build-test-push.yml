---
name: Build, Test, and Push Single Architecture Image

on:
  workflow_call:
    inputs:
      title:
        description: The title of the image
        type: string
        required: true
      description:
        description: The description of the image
        type: string
        required: true
      image:
        description: The name image to build (also corresponds to a Pixi environment)
        type: string
        required: true
      platform:
        description: The platform to build for (linux/amd64 or linux/arm64)
        type: string
        required: true
      target:
        description: The target layer to build
        type: string
        required: false
      build-args:
        description: Build arguments to pass to the image
        type: string
        required: false
      extra-cache-from:
        description: Additional Docker images that might be able to contribute cached layers (beyond the automatic cache sources)
        type: string
        required: false
      free-disk-space:
        description: Whether to free disk space before building
        type: boolean
        required: false
        default: false
      skip-tests:
        description: Whether to skip tests
        type: boolean
        required: false
        default: false
      lock-artifact:
        description: Name of a workflow artifact containing an updated pixi.lock file to use instead of the checked-in version
        type: string
        required: false

    outputs:
      image:
        description: The image name
        value: ${{ jobs.build.outputs.image }}
      platform:
        description: The platform built
        value: ${{ jobs.build.outputs.platform }}
      digest:
        description: The image digest
        value: ${{ jobs.build.outputs.digest }}
      tag:
        description: The image tag (with platform suffix)
        value: ${{ jobs.build.outputs.tag }}
      cache-tag:
        description: The complete cache tag reference (e.g., ghcr.io/owner/image:cache-amd64)
        value: ${{ jobs.build.outputs.cache-tag }}

jobs:
  build:
    permissions:
      contents: read
      packages: write
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    outputs:
      image: ${{ inputs.image }}
      platform: ${{ inputs.platform }}
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.build.outputs.metadata }}
      cache-tag: ${{ steps.context.outputs.cache-tag }}

    steps:
      - name: Setup build context
        id: context
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          IMAGE: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_CACHE_FROM: ${{ inputs.extra-cache-from }}
        run: |
          if [[ "$PLATFORM" != "linux/amd64" && "$PLATFORM" != "linux/arm64" ]]; then
            echo "::error title=Unsupported Platform::Platform '$PLATFORM' is not supported. Only linux/amd64 and linux/arm64 are supported."
            exit 1
          fi
          echo "::notice::Platform: $PLATFORM"

          if [[ "$PLATFORM" == "linux/amd64" ]]; then
            PLATFORM_TAG="amd64"
          else
            PLATFORM_TAG="arm64"
          fi
          CACHE_TAG="ghcr.io/${OWNER}/next/${IMAGE}:cache-${PLATFORM_TAG}"
          echo "cache-tag=$CACHE_TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::Cache tag: $CACHE_TAG"

          echo "secret-files=" >> "$GITHUB_OUTPUT"

          {
            echo 'cache-from<<EOF'
            echo "type=registry,ref=ghcr.io/${OWNER}/next/${IMAGE}:weekly"
            echo "type=registry,ref=$CACHE_TAG"
            if [[ -n "$EXTRA_CACHE_FROM" ]]; then
              echo "$EXTRA_CACHE_FROM"
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Cache sources configured"

      - name: Free Disk Space (Ubuntu)
        if: inputs.free-disk-space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          tool-cache: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download updated lock file
        if: inputs.lock-artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.lock-artifact }}
          path: .

      - name: Read the pixi version the image is built with
        id: pixi-version
        run: sed -n 's/^ARG PIXI_VERSION=/version=/p' Dockerfile >> "$GITHUB_OUTPUT"

      - name: Setup Pixi
        if: inputs.target != 'base'
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v${{ steps.pixi-version.outputs.version }}
          run-install: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platform }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          secret-files: ${{ steps.context.outputs.secret-files }}
          cache-to: |
            type=registry,ref=${{ steps.context.outputs.cache-tag }},mode=max
          cache-from: ${{ steps.context.outputs.cache-from }}
          push: true
          provenance: false
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/next/${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true

      # Cached down to the test layers, so this runs what was just pushed.
      - name: Build test image
        if: inputs.skip-tests != true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: test
          platforms: ${{ inputs.platform }}
          build-args: ${{ inputs.build-args }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: ${{ steps.context.outputs.cache-from }}
          load: true
          push: false
          provenance: false
          tags: ${{ inputs.image }}:test

      - name: Test
        if: inputs.skip-tests != true
        shell: bash
        env:
          PLATFORM: ${{ inputs.platform }}
          TEST_IMAGE: ${{ inputs.image }}:test
        run: docker run --rm --platform="$PLATFORM" "$TEST_IMAGE"

      # A record, not a gate: the two architectures may legitimately differ.
      - name: Record installed R packages
        if: inputs.target != 'base'
        shell: bash
        env:
          IMAGE_NAME: ${{ inputs.image }}
          PLATFORM: ${{ inputs.platform }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          docker run --rm --platform="$PLATFORM" \
            "ghcr.io/${REPO_OWNER}/next/${IMAGE_NAME}@${DIGEST}" \
            Rscript -e 'ip <- installed.packages()[, c("Package", "Version")]; cat(sprintf("%s@%s", ip[, 1], ip[, 2]), sep = "\n")' \
            | LC_ALL=C sort > "r-${IMAGE_NAME}.txt"
          wc -l < "r-${IMAGE_NAME}.txt" | xargs -I{} echo "r-${IMAGE_NAME}.txt: {} packages" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload R package record
        if: inputs.target != 'base'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-packages-${{ inputs.image }}-${{ inputs.platform == 'linux/arm64' && 'arm64' || 'amd64' }}
          path: r-${{ inputs.image }}.txt
