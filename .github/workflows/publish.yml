---
name: Build Currency Candidate

on:
  workflow_dispatch:
  schedule:
    # Weekly, at 03:00 on Monday UTC time (see https://crontab.guru)
    - cron: "0 3 * * 1"

# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  # only cancel in-progress jobs or runs for the current workflow - matches against branch & tags
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A static proof that fails before any image exists beats a build-time one.
  # Gates the lock `update-lock` just regenerated, not the committed one, so
  # a `pixi update` that breaks containment or cross-arch identity is caught
  # before the matrix burns 40 minutes building it.
  gate:
    name: Static Gate
    needs: [update-lock]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download updated lock file
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pixi-lock
          path: .

      # run-install: false because the gate only needs the pixi binary for `pixi
      # lock --check`, not an installed environment; and the runner's system
      # python3 (not an activated env's) is what should end up on PATH.
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@28eb668aafebd9dede9d97c4ba1cd9989a4d0004 # v0.9.2
        with:
          run-install: false

      # PyYAML is not guaranteed on the runner image, and this gate now blocks
      # every build: an ImportError here stops the whole lane.
      - name: Install gate dependencies
        run: python3 -m pip install --quiet pyyaml

      # shellcheck ships on the runner. It has been passing all along with
      # nothing enforcing it, which is the same as not passing.
      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/tests/*.sh scripts/tests/*.bats

      - name: Static gate
        run: python3 scripts/gate/static.py

  # Resolve package versions once so all builds use the same lock file
  update-lock:
    name: Update Lock File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@28eb668aafebd9dede9d97c4ba1cd9989a4d0004 # v0.9.2
        with:
          run-install: false

      - name: Update Conda packages
        run: pixi update

      - name: Upload lock file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pixi-lock
          path: pixi.lock

  # Derive the build matrix from the manifest so adding an environment never
  # needs a workflow edit
  setup:
    name: Derive Build Matrix
    needs: [update-lock]
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download updated lock file
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pixi-lock
          path: .

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@28eb668aafebd9dede9d97c4ba1cd9989a4d0004 # v0.9.2
        with:
          run-install: false

      - name: Derive image matrix
        id: matrix
        run: |
          # Titles and descriptions become OCI labels. Quoted heredoc so the
          # apostrophes survive; an environment with no entry still builds,
          # taking its own name and a generated description.
          meta=$(cat <<'JSON'
          {
            "base-r-notebook":      {"title": "Base R Notebook",      "description": "Jupyter Lab, Python, and R, and that's it."},
            "essentials-notebook":  {"title": "Essentials Notebook",  "description": "CourseKata essentials - everything used in the books."},
            "r-notebook":           {"title": "R Notebook",           "description": "CourseKata essentials and other R packages for teaching and learning data science."},
            "datascience-notebook": {"title": "Data Science Notebook","description": "R and Python packages for teaching and learning data science."},
            "datascience-core":     {"title": "Data Science Core",    "description": "The Data Science Notebook environment without the Jupyter front end, for embedding in CKHub."},
            "exercises-notebook":   {"title": "Exercises Notebook",   "description": "Essentials plus the exercise-checking machinery that grades inline book exercises."}
          }
          JSON
          )
          images=$(pixi info --json | jq -c '[.environments_info[].name | select(. != "default")]')
          include=$(jq -c -n --argjson images "$images" --argjson meta "$meta" '
            [ $images[] | . as $name | {
                image: $name,
                title: ($meta[$name].title // $name),
                description: ($meta[$name].description // ("CourseKata " + $name + " environment."))
              } ]')
          echo "images=$include" >> "$GITHUB_OUTPUT"

  # Resolve every environment's R refs to pinned versions once, so both
  # architecture builds install the exact same package set. Runs on
  # ubuntu-24.04 (not ubuntu-latest): the sysreqs platform and the lock's
  # recorded os must be noble to match the image.
  # Build foundation base layer for both architectures
  # The base target doesn't use pixi at all. It runs first because every image
  # build reads its layers from the registry cache, not because of the lock.
  foundation:
    needs: [gate]
    uses: ./.github/workflows/build-test-push-multiarch.yml
    secrets: inherit
    with:
      image: foundation
      target: base
      title: Foundational Image for CourseKata Notebook Images
      description: System dependencies for CourseKata notebook images.
      skip-tests: true
      build-args: |
        PIXI_ENV=default

  # Build all notebook images (each builds both architectures internally)
  images:
    needs: [gate, foundation, setup, update-lock]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.images) }}

    uses: ./.github/workflows/build-test-push-multiarch.yml
    secrets: inherit
    with:
      image: ${{ matrix.image }}
      target: final
      title: ${{ matrix.title }}
      description: ${{ matrix.description }}
      build-args: |
        PIXI_ENV=${{ matrix.image }}
      cache-from: ${{ needs.foundation.outputs.cache-from }}
      free-disk-space: ${{ matrix.image == 'datascience-notebook' || matrix.image == 'datascience-core' }}
      lock-artifact: pixi-lock
