---
name: Build and Publish Images

on:
  workflow_dispatch:
  schedule:
    # Weekly, at 03:00 on Monday UTC time (see https://crontab.guru)
    - cron: "0 3 * * 1"
  # No path filters here on purpose: a path-filtered workflow reports no checks at
  # all on a docs-only pull request, which would leave a required `ci-passed`
  # pending forever. The `changes` job below decides what actually needs building.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  # only cancel in-progress jobs or runs for the current workflow - matches against branch & tags
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  # Anything that changes what an image contains rebuilds it. Docs, licences and the
  # READMEs deliberately do not: they cannot alter the artifact. This used to live in
  # the `on:` triggers above; it moved here so the workflow always runs and therefore
  # always reports `ci-passed`, while the expensive jobs still skip.
  changes:
    permissions:
      contents: read
    name: Detect Build Changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether anything build-affecting changed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail
          pattern='^(\.github/workflows/(publish|build-test-push|build-test-push-multiarch)\.yml|pixi\.(toml|lock)|Dockerfile|Rprofile\.site|r/.*|scripts/.*)$'

          case "$EVENT_NAME" in
            pull_request) base="$BASE_SHA" ;;
            push) base="$BEFORE_SHA" ;;
            # A schedule or a manual run has nothing to compare against, and both exist
            # precisely to rebuild.
            *) echo "build=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          # A new branch or a force-push leaves no usable base. Rebuild rather than guess.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "::notice::No usable base commit; building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          if printf '%s\n' "$changed" | grep -Eq "$pattern"; then
            echo "::notice::Build-affecting files changed."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nothing that can alter an image changed."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi


  lint:
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    permissions:
      contents: read
      # zizmor uploads its findings to code scanning
      security-events: write
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/tests/*.sh scripts/tests/*.bats

      - name: Test promotion safety checks
        run: python3 -m unittest scripts/tests/test_promote_images.py

      - name: Zizmor
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3

  update-lock:
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    permissions:
      contents: read
    name: Update Lock File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pixi version the image is built with
        id: pixi-version
        run: sed -n 's/^ARG PIXI_VERSION=/version=/p' Dockerfile >> "$GITHUB_OUTPUT"

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v${{ steps.pixi-version.outputs.version }}
          run-install: false

      - name: Update Conda packages
        run: pixi update

      # Every build resolves conda and PyPI fresh, so this is not about staleness.
      # It answers what nothing else does: did the solver pick a version with a
      # published advisory? That is the signal to add a floor to pixi.toml, which
      # ratchets against the solver backtracking rather than bumping anything.
      # Report-only: a finding is a prompt to look, not a reason to block a build
      # whose alternative is shipping the previous image for longer.
      - name: Check the resolved Python packages for advisories
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pyyaml
          python3 scripts/check-advisories.py pixi.lock | tee advisories.txt
          {
            echo "### Python advisories in the resolved lock"
            echo
            echo '```'
            cat advisories.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lock file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pixi-lock
          path: pixi.lock

  # Derive the build matrix from the manifest so adding an environment never
  # needs a workflow edit
  setup:
    permissions:
      contents: read
    name: Derive Build Matrix
    needs: [update-lock]
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download updated lock file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pixi-lock
          path: .

      - name: Read the pixi version the image is built with
        id: pixi-version
        run: sed -n 's/^ARG PIXI_VERSION=/version=/p' Dockerfile >> "$GITHUB_OUTPUT"

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v${{ steps.pixi-version.outputs.version }}
          run-install: false

      - name: Derive image matrix
        id: matrix
        run: |
          # Titles and descriptions become OCI labels. Quoted heredoc so the
          # apostrophes survive; an environment with no entry still builds,
          # taking its own name and a generated description.
          meta=$(cat <<'JSON'
          {
            "base-r-notebook":      {"title": "Base R Notebook",      "description": "Jupyter Lab, Python, and R, and that's it."},
            "essentials-notebook":  {"title": "Essentials Notebook",  "description": "CourseKata essentials - everything used in the books."},
            "r-notebook":           {"title": "R Notebook",           "description": "CourseKata essentials and other R packages for teaching and learning data science."},
            "datascience-notebook": {"title": "Data Science Notebook","description": "R and Python packages for teaching and learning data science."},
            "datascience-core":     {"title": "Data Science Core",    "description": "The Data Science Notebook environment without the Jupyter front end, for embedding in CKHub."},
            "exercises-notebook":   {"title": "Exercises Notebook",   "description": "Essentials plus the exercise-checking machinery that grades inline book exercises."}
          }
          JSON
          )
          images=$(pixi info --json | jq -c '[.environments_info[].name | select(. != "default")]')
          include=$(jq -c -n --argjson images "$images" --argjson meta "$meta" '
            [ $images[] | . as $name | {
                image: $name,
                title: ($meta[$name].title // $name),
                description: ($meta[$name].description // ("CourseKata " + $name + " environment."))
              } ]')
          echo "images=$include" >> "$GITHUB_OUTPUT"

  # Runs first because every image build reads its layers from the registry cache.
  foundation:
    permissions:
      contents: read
      packages: write
    needs: [lint]
    uses: ./.github/workflows/build-test-push-multiarch.yml
    with:
      image: foundation
      target: base
      publish: ${{ github.event_name != 'pull_request' }}
      title: Foundational Image for CourseKata Notebook Images
      description: System dependencies for CourseKata notebook images.
      skip-tests: true
      build-args: |
        PIXI_ENV=default

  # Build all notebook images (each builds both architectures internally)
  images:
    permissions:
      contents: read
      packages: write
    needs: [lint, foundation, setup, update-lock]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.images) }}

    uses: ./.github/workflows/build-test-push-multiarch.yml
    with:
      image: ${{ matrix.image }}
      target: final
      publish: ${{ github.event_name != 'pull_request' }}
      title: ${{ matrix.title }}
      description: ${{ matrix.description }}
      build-args: |
        PIXI_ENV=${{ matrix.image }}
      cache-from: ${{ needs.foundation.outputs.cache-from }}
      free-disk-space: ${{ matrix.image == 'datascience-notebook' || matrix.image == 'datascience-core' }}
      lock-artifact: pixi-lock

  # The single stable status check a branch ruleset points at, matching the name
  # ck-tf-modules already uses. The image jobs cannot be required directly: their
  # matrix names embed each image's description, so editing a description would
  # silently orphan the requirement. `skipped` counts as success here - it means the
  # change could not affect an image.
  ci-passed:
    permissions: {}
    if: always()
    needs: [changes, lint, update-lock, setup, foundation, images]
    runs-on: ubuntu-latest
    steps:
      - name: Assert no required job failed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -uo pipefail
          echo "$RESULTS"
          bad=$(printf '%s' "$RESULTS" | jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | "\(.key): \(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::$bad"
            exit 1
          fi
          echo "All required jobs succeeded or were skipped."
