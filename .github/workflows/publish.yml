---
name: Build and Publish Images

on:
  workflow_dispatch:
  schedule:
    # Weekly, at 03:00 on Monday UTC time (see https://crontab.guru)
    - cron: "0 3 * * 1"
  # Anything that changes what an image contains rebuilds it. Docs, licences
  # and the READMEs deliberately do not: they cannot alter the artifact.
  push:
    branches: [main]
    paths:
      # ci/cd
      - .github/workflows/publish.yml
      - .github/workflows/build-test-push-multiarch.yml
      - .github/workflows/build-test-push.yml
      # build
      - pixi.toml
      - pixi.lock
      - Dockerfile
      - Rprofile.site
      # the Dockerfile composes pak refs from these
      - r/**
      # get-refs.py and the test suite both ship into the build
      - scripts/**
  pull_request:
    branches: [main]
    paths:
      # ci/cd
      - .github/workflows/publish.yml
      - .github/workflows/build-test-push-multiarch.yml
      - .github/workflows/build-test-push.yml
      # build
      - pixi.toml
      - pixi.lock
      - Dockerfile
      - Rprofile.site
      # the Dockerfile composes pak refs from these
      - r/**
      # get-refs.py and the test suite both ship into the build
      - scripts/**

# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  # only cancel in-progress jobs or runs for the current workflow - matches against branch & tags
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  lint:
    permissions:
      contents: read
      # zizmor uploads its findings to code scanning
      security-events: write
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/tests/*.sh scripts/tests/*.bats

      - name: Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  update-lock:
    permissions:
      contents: read
    name: Update Lock File
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read the pixi version the image is built with
        id: pixi-version
        run: sed -n 's/^ARG PIXI_VERSION=/version=/p' Dockerfile >> "$GITHUB_OUTPUT"

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@28eb668aafebd9dede9d97c4ba1cd9989a4d0004 # v0.9.2
        with:
          pixi-version: v${{ steps.pixi-version.outputs.version }}
          run-install: false

      - name: Update Conda packages
        run: pixi update

      - name: Upload lock file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pixi-lock
          path: pixi.lock

  # Derive the build matrix from the manifest so adding an environment never
  # needs a workflow edit
  setup:
    permissions:
      contents: read
    name: Derive Build Matrix
    needs: [update-lock]
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.matrix.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download updated lock file
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pixi-lock
          path: .

      - name: Read the pixi version the image is built with
        id: pixi-version
        run: sed -n 's/^ARG PIXI_VERSION=/version=/p' Dockerfile >> "$GITHUB_OUTPUT"

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@28eb668aafebd9dede9d97c4ba1cd9989a4d0004 # v0.9.2
        with:
          pixi-version: v${{ steps.pixi-version.outputs.version }}
          run-install: false

      - name: Derive image matrix
        id: matrix
        run: |
          # Titles and descriptions become OCI labels. Quoted heredoc so the
          # apostrophes survive; an environment with no entry still builds,
          # taking its own name and a generated description.
          meta=$(cat <<'JSON'
          {
            "base-r-notebook":      {"title": "Base R Notebook",      "description": "Jupyter Lab, Python, and R, and that's it."},
            "essentials-notebook":  {"title": "Essentials Notebook",  "description": "CourseKata essentials - everything used in the books."},
            "r-notebook":           {"title": "R Notebook",           "description": "CourseKata essentials and other R packages for teaching and learning data science."},
            "datascience-notebook": {"title": "Data Science Notebook","description": "R and Python packages for teaching and learning data science."},
            "datascience-core":     {"title": "Data Science Core",    "description": "The Data Science Notebook environment without the Jupyter front end, for embedding in CKHub."},
            "exercises-notebook":   {"title": "Exercises Notebook",   "description": "Essentials plus the exercise-checking machinery that grades inline book exercises."}
          }
          JSON
          )
          images=$(pixi info --json | jq -c '[.environments_info[].name | select(. != "default")]')
          include=$(jq -c -n --argjson images "$images" --argjson meta "$meta" '
            [ $images[] | . as $name | {
                image: $name,
                title: ($meta[$name].title // $name),
                description: ($meta[$name].description // ("CourseKata " + $name + " environment."))
              } ]')
          echo "images=$include" >> "$GITHUB_OUTPUT"

  # Runs first because every image build reads its layers from the registry cache.
  foundation:
    permissions:
      contents: read
      packages: write
    needs: [lint]
    uses: ./.github/workflows/build-test-push-multiarch.yml
    with:
      image: foundation
      target: base
      publish: ${{ github.event_name != 'pull_request' }}
      title: Foundational Image for CourseKata Notebook Images
      description: System dependencies for CourseKata notebook images.
      skip-tests: true
      build-args: |
        PIXI_ENV=default

  # Build all notebook images (each builds both architectures internally)
  images:
    permissions:
      contents: read
      packages: write
    needs: [lint, foundation, setup, update-lock]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.images) }}

    uses: ./.github/workflows/build-test-push-multiarch.yml
    with:
      image: ${{ matrix.image }}
      target: final
      publish: ${{ github.event_name != 'pull_request' }}
      title: ${{ matrix.title }}
      description: ${{ matrix.description }}
      build-args: |
        PIXI_ENV=${{ matrix.image }}
      cache-from: ${{ needs.foundation.outputs.cache-from }}
      free-disk-space: ${{ matrix.image == 'datascience-notebook' || matrix.image == 'datascience-core' }}
      lock-artifact: pixi-lock
