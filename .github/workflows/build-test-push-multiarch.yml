---
name: Build, Test, and Push Multi-Architecture Image

on:
  workflow_call:
    inputs:
      title:
        description: The title of the image
        type: string
        required: true
      description:
        description: The description of the image
        type: string
        required: true
      image:
        description: The name image to build (also corresponds to a Pixi environment)
        type: string
        required: true
      target:
        description: The target layer to build
        type: string
        required: false
      publish:
        description: Whether to tag the result. False on pull requests, which build and test but must not move a published tag.
        type: boolean
        required: false
        default: true
      build-args:
        description: Build arguments to pass to the image
        type: string
        required: false
      cache-from:
        description: Docker images that might be able to contribute cached layers
        type: string
        required: false
      free-disk-space:
        description: Whether to free disk space before building
        type: boolean
        required: false
        default: false
      skip-tests:
        description: Whether to skip tests
        type: boolean
        required: false
        default: false
      lock-artifact:
        description: Name of a workflow artifact containing an updated pixi.lock file to use instead of the checked-in version
        type: string
        required: false

    outputs:
      cache-from:
        description: Cache references for this image (formatted for use in downstream cache-from)
        value: ${{ jobs.manifest.outputs.cache-from }}

jobs:
  build-amd64:
    permissions:
      contents: read
      packages: write
    name: Build (AMD64)
    uses: ./.github/workflows/build-test-push.yml
    with:
      image: ${{ inputs.image }}
      platform: linux/amd64
      target: ${{ inputs.target }}
      title: ${{ inputs.title }}
      description: ${{ inputs.description }}
      build-args: ${{ inputs.build-args }}
      extra-cache-from: ${{ inputs.cache-from }}
      free-disk-space: ${{ inputs.free-disk-space }}
      skip-tests: ${{ inputs.skip-tests }}
      lock-artifact: ${{ inputs.lock-artifact }}

  build-arm64:
    permissions:
      contents: read
      packages: write
    name: Build (ARM64)
    uses: ./.github/workflows/build-test-push.yml
    with:
      image: ${{ inputs.image }}
      platform: linux/arm64
      target: ${{ inputs.target }}
      title: ${{ inputs.title }}
      description: ${{ inputs.description }}
      build-args: ${{ inputs.build-args }}
      extra-cache-from: ${{ inputs.cache-from }}
      free-disk-space: ${{ inputs.free-disk-space }}
      skip-tests: ${{ inputs.skip-tests }}
      lock-artifact: ${{ inputs.lock-artifact }}

  manifest:
    permissions:
      contents: read
      packages: write
    name: Create Multi-Arch Manifest
    if: inputs.publish
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    outputs:
      cache-from: ${{ steps.set-cache-output.outputs.cache-from }}

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/next/${{ inputs.image }}
          tags: |
            type=raw,value=weekly
            type=raw,value={{date 'YYYY-MM-DD'}}
          labels: |
            org.opencontainers.image.title=${{ inputs.title }}
            org.opencontainers.image.description=${{ inputs.description }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme

      - name: Create and push multi-arch manifest
        shell: bash
        env:
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
          TAGS: ${{ steps.meta.outputs.tags }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
          AMD64_DIGEST: ${{ needs.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.build-arm64.outputs.digest }}
        run: |
          # docker wants --annotation index:key="value", quotes around the value only
          ANNOTATION_FLAGS=()
          while IFS= read -r annotation; do
            if [[ -n "$annotation" ]]; then
              key="${annotation%%=*}"
              value="${annotation#*=}"
              ANNOTATION_FLAGS+=(--annotation)
              ANNOTATION_FLAGS+=("${key}=\"${value}\"")
            fi
          done <<< "$ANNOTATIONS"

          echo "$TAGS" | while IFS= read -r tag; do
            echo "Creating manifest for $tag"
            docker buildx imagetools create "${ANNOTATION_FLAGS[@]}" -t "$tag" \
              "ghcr.io/${OWNER}/next/${IMAGE}@${AMD64_DIGEST}" \
              "ghcr.io/${OWNER}/next/${IMAGE}@${ARM64_DIGEST}"
          done

      - name: Inspect manifest
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          FIRST_TAG=$(echo "$TAGS" | head -n1)
          echo "Inspecting $FIRST_TAG"
          docker buildx imagetools inspect "$FIRST_TAG"

      - name: Set cache output
        id: set-cache-output
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ inputs.image }}
          AMD64_CACHE: ${{ needs.build-amd64.outputs.cache-tag }}
          ARM64_CACHE: ${{ needs.build-arm64.outputs.cache-tag }}
        run: |
          {
            echo 'cache-from<<EOF'
            echo "type=registry,ref=ghcr.io/${OWNER}/next/${IMAGE}:weekly"
            echo "type=registry,ref=${AMD64_CACHE}"
            echo "type=registry,ref=${ARM64_CACHE}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
