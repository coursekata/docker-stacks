[workspace]
authors = ["Adam Blake <adam@ablake.dev>"]
channels = ["conda-forge", "default"]
description = "CourseKata Jupyter environments"
name = "coursekata"
platforms = ["linux-aarch64", "linux-64"]
requires-pixi = ">=0.63.2"

[dependencies]
python = ">=3.13.18,<3.14"
brotli-python = ">=1.2.1,<2"
certifi = ">=2026.10.19"
urllib3 = ">=2.8.0,<3"
jupyter_core = ">=5.7.2,<6"
ipykernel = ">=6.29.5,<8"

[pypi-dependencies]
pip = ">=26.3,<27"

[feature.notebook.dependencies]
jupyterlab = ">=4.6.4,<5"
notebook = ">=7.6.3,<8"
nbclassic = ">=1.1.0,<2"
nbconvert-core = ">=7.17.2,<8"
mako = ">=1.4.2,<2"
oauthlib = ">=4.0.0,<5"
pyjwt = ">=2.15.1,<3"

[feature.notebook.pypi-dependencies]
# Conda-forge has no patched JupyterHub 5.x build; retain the supported major.
jupyterhub = ">=5.5.5,<6"

[feature.base-r.dependencies]
r-base = ">=4.6,<5"

[feature.essentials.dependencies]

[feature.exercises.dependencies]
asttokens = "<3"

[feature.exercises.pypi-dependencies]
pythonwhat = ">=2.3.0,<3"

[feature.r.dependencies]

[feature.datascience.dependencies]
brotli = ">=1.2.1,<2"
gensim = ">=4.4.0,<5"
ipywidgets = ">=8.1.5,<9"
matplotlib-base = ">=3.9.4,<4"
nltk = ">=3.10.4,<4"
openpyxl = ">=3.1.5,<4"
pillow = ">=13.0.0,<14"
pandas = ">=2.2.3,<3"
plotly = ">=5.24.1,<6"
scikit-learn = ">=1.6.0,<2"
scipy = ">=1.14.1,<2"
seaborn = ">=0.13.2,<0.14"
statsmodels = ">=0.14.4,<0.15"

# these carry no conda packages; they exist so the R side can name the tier
[feature.instructor-9e09470c-489b-4f9b-af4c-ffc524e10637.dependencies]

[feature.instructor-e668a15b-3c9f-4ab0-b479-ff2db8404eff.dependencies]

[environments.base-r-notebook]
features = ["notebook", "base-r"]
solve-group = "main"

[environments.essentials-notebook]
features = ["notebook", "base-r", "essentials"]
solve-group = "main"

[environments.r-notebook]
features = ["notebook", "base-r", "essentials", "r"]
solve-group = "main"

[environments.datascience-notebook]
features = ["notebook", "base-r", "essentials", "r", "datascience", "instructor-9e09470c-489b-4f9b-af4c-ffc524e10637", "instructor-e668a15b-3c9f-4ab0-b479-ff2db8404eff"]
solve-group = "main"

[environments.datascience-core]
features = ["base-r", "essentials", "r", "datascience", "instructor-9e09470c-489b-4f9b-af4c-ffc524e10637", "instructor-e668a15b-3c9f-4ab0-b479-ff2db8404eff"]
solve-group = "main"

[environments.exercises-notebook]
features = ["notebook", "base-r", "essentials", "exercises"]
